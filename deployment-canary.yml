apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kubeserve-canary
spec:
  replicas: 4

  selector:
    matchLabels:
      app: kubeserve

  template:
    metadata:
      labels:
        app: kubeserve
    spec:
      containers:
      - name: c1
        image: leaddevops/kubeserve:v1
        ports:
        - containerPort: 80

  strategy:
   canary:
    steps:
    - setWeight: 25
    - pause:
        duration: 30s

    - setWeight: 50
    - pause:
        duration: 30s

    - setWeight: 75
    - pause:
        duration: 30s

    - setWeight: 100
